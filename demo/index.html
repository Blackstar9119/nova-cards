<!doctype html>
<!-- Nova Demo: alle Karten mit Testdaten, ohne Home Assistant. Aufruf über einen lokalen Webserver im Repo-Root:
     demo/index.html            lädt ../nova-cards.js
     demo/index.html?src=…      lädt einen anderen Build (z. B. ../dev/nova-dev-cards.js)
     demo/index.html?only=a,b   zeigt nur diese Karten (z. B. shopping-card,note-card)
     demo/index.html?theme=…    setzt das Nova-Theme für alle Karten (wie die Theme-Variable nova-theme eines HA-Themes) -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova Demo</title>
<style>
html{background:linear-gradient(160deg,#6a7fa3 0%,#34405e 50%,#1b2134 100%) fixed;min-height:100%}
body{margin:0;padding:24px;font-family:Roboto,Arial,sans-serif;color:#fff;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
figure{margin:0;display:flex;flex-direction:column;gap:6px}
figcaption{font-size:12px;opacity:.7}
.slot{display:block}
html.light{background:linear-gradient(160deg,#f4f6f9 0%,#e3e7ee 60%,#d6dbe4 100%) fixed}html.light body{color:#1b2230}
html.black{background:#000}
html.velvet{background:linear-gradient(160deg,#f2eadc 0%,#e7dcc8 60%,#dccfb7 100%) fixed}html.velvet body{color:#1a0f09}
</style>
</head>
<body>
<script type="module">
import {hass, cards} from './mock.js';
const q = new URLSearchParams(location.search);
// Theme wie aus einem HA-Theme (nova-theme: hell) – gilt für alle Karten mit Theme „Global“
if (q.get('theme')) document.documentElement.style.setProperty('--nova-theme', q.get('theme'));
if (['hell'].includes(q.get('theme'))) document.documentElement.classList.add('light');
if (q.get('theme') === 'midnight') document.documentElement.classList.add('black');
if (q.get('theme') === 'velvet') document.documentElement.classList.add('velvet');
// Platzhalter für Elemente, die sonst Home Assistant mitbringt
for (const t of ['ha-icon', 'ha-state-icon', 'ha-svg-icon', 'ha-card']) customElements.get(t) || customElements.define(t, class extends HTMLElement {});
// Nachbau einer HA-Karte (Hintergrund, Rahmen, Schrift wie ha-card; error = Fehlerkarte mit 12 % --error-color darüber)
customElements.define('demo-ha-card', class extends HTMLElement {
  setConfig(c) { this._c = c; }
  set hass(h) { if (this.shadowRoot) return; this.attachShadow({mode: 'open'}).innerHTML = `<style>:host{display:block}
.c{position:relative;padding:16px;background:var(--ha-card-background,var(--card-background-color,#fff));border-radius:var(--ha-card-border-radius,12px);
border:var(--ha-card-border-width,1px) solid var(--ha-card-border-color,#e0e0e0);box-shadow:var(--ha-card-box-shadow,none);color:var(--primary-text-color,#212121);font:14px Roboto,sans-serif}
.c.err{border-width:0}.c.err::after{content:'';position:absolute;inset:0;border-radius:inherit;background:var(--error-color,#db4437);opacity:.12}
small{display:block;color:var(--secondary-text-color,#727272)}b{color:var(--c)}.err b{--c:var(--error-color,#db4437)}</style>
<div class="c ${this._c.error ? 'err' : ''}"><b>${this._c.error ? '⚠ ' : ''}</b>${this._c.title}<small>${this._c.text || ''}</small></div>`; }
});
window.loadCardHelpers = async () => ({createCardElement: c => { const el = document.createElement(String(c.type).replace(/^custom:/, '')); try { el.setConfig?.(c); } catch (e) { el.textContent = e.message; } return el; }});
await new Promise((ok, no) => { const s = document.createElement('script'); s.src = q.get('src') || '../nova-cards.js'; s.onload = ok; s.onerror = no; document.head.append(s); });
const pre = (window.customCards || []).some(c => c.type.startsWith('nova-dev-')) ? 'nova-dev-' : 'nova-';
const only = q.get('only')?.split(',');
for (const [type, conf, width] of cards) {
  if (only && !only.includes(type)) continue;
  const tag = pre + type, cls = customElements.get(tag), fig = document.createElement('figure');
  fig.innerHTML = `<figcaption>${type}${conf ? ' · ' + Object.entries(conf).filter(([, v]) => typeof v !== 'object').map(([k, v]) => `${k}: ${v}`).join(', ') : ''}</figcaption><div class="slot" style="width:${width || 380}px"></div>`;
  document.body.append(fig);
  if (!cls) { fig.querySelector('.slot').textContent = 'fehlt im Build'; continue; }
  try {
    const el = document.createElement(tag);
    el.setConfig({type: 'custom:' + tag, ...(conf || await cls.getStubConfig?.(hass) || {})});
    el.hass = hass;
    fig.querySelector('.slot').append(el);
  } catch (e) { fig.querySelector('.slot').textContent = 'Fehler: ' + e.message; }
}
document.body.dataset.ready = '1';
</script>
</body>
</html>
