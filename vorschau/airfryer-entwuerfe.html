<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Airfryer-Entwürfe</title>
<!-- Nur Vorschau für die Auswahl des Airfryer-Bilds der Gerät Card – nicht Teil des Builds, vor dem Merge löschen -->
<style>
:root{--dc:#f5b83d;--fg:#fff}
body{margin:0;padding:20px;font-family:system-ui,sans-serif;color:var(--fg);background:linear-gradient(135deg,#2b3550,#121624);min-height:100vh}
h1{font-size:20px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.col{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:14px}
.col h2{font-size:16px;margin:0 0 4px}.col p{font-size:12px;opacity:.7;margin:0 0 10px;min-height:32px}
.big{display:flex;gap:10px}.big>div{flex:1;min-width:0}.big svg{width:100%;height:auto;overflow:visible}
.card{margin-top:12px;display:flex;align-items:center;gap:14px;padding:12px;border-radius:18px;background:linear-gradient(160deg,rgba(80,96,128,.55),rgba(22,27,42,.62));border:1px solid rgba(255,255,255,.14)}
.card svg{width:92px;height:92px;overflow:visible;flex:none}.card b{font-size:16px}.card small{display:block;opacity:.7;font-size:12px}
.lbl{font-size:11px;opacity:.6;text-align:center;margin-top:2px}
/* gemeinsame Zeichenstile wie in der Karte: Textfarbe + Gerätefarbe, Schatten schwarz transparent */
svg{color:var(--fg)}
.bd{fill:currentColor;fill-opacity:.12;stroke:currentColor;stroke-opacity:.32;stroke-width:1.3}
.pn{fill:rgba(0,0,0,.28)}
.kb{fill:currentColor;fill-opacity:.26;stroke:currentColor;stroke-opacity:.5;stroke-width:1.2}
.kn{stroke:currentColor;stroke-opacity:.85;stroke-width:2.2;stroke-linecap:round}
.ring{fill:none;stroke:currentColor;stroke-opacity:.18;stroke-width:2.2}
.arc{fill:none;stroke:var(--dc);stroke-width:2.2;stroke-linecap:round}
.disp{fill:rgba(0,0,0,.45);stroke:currentColor;stroke-opacity:.3;stroke-width:1}
.dt{fill:var(--dc);font:700 7px system-ui,sans-serif;text-anchor:middle}
.btn{fill:currentColor;fill-opacity:.3}
.gap{fill:rgba(0,0,0,.42)}
.fr{fill:currentColor;fill-opacity:.2;stroke:currentColor;stroke-opacity:.45;stroke-width:1.2}
.hl{fill:none;stroke:currentColor;stroke-opacity:.35;stroke-width:1.2;stroke-linecap:round}
.hs{fill:rgba(0,0,0,.35)}
.hd{fill:currentColor;fill-opacity:.5;stroke:currentColor;stroke-opacity:.7;stroke-width:1}
.win{fill:rgba(0,0,0,.4);stroke:currentColor;stroke-opacity:.3;stroke-width:1}
.glo{fill:var(--dc);fill-opacity:.25}
.fry{stroke:var(--dc);stroke-opacity:.85;stroke-width:3.6;stroke-linecap:round}
.sh{fill:rgba(0,0,0,.3)}
.cav{fill:rgba(0,0,0,.55);stroke:currentColor;stroke-opacity:.2;stroke-width:1}
</style></head><body>
<h1>Airfryer – 4 Entwürfe (links groß: zu und Schublade raus, darunter in Kartengröße 92 px)</h1>
<div class="grid" id="g"></div>
<script>
// Schublade als eigene Gruppe: geschlossen an Ort und Stelle, offen verkleinert rechts neben dem Gerät
const OPEN = 'translate(50 34) scale(.66)';
const D = {
  A: {t: 'A · Drehknopf', d: 'Hohes, weiches Gehäuse, oben ein großer Drehknopf mit Zeiger und Fortschrittsring. Schublade ohne Fenster, großer Griff.',
    body: `<ellipse class="sh" cx="50" cy="96" rx="32" ry="3"/>
<rect class="bd" x="17" y="7" width="66" height="88" rx="26"/>
<rect class="pn" x="29" y="13" width="42" height="30" rx="15"/>
<circle class="ring" cx="50" cy="28" r="11.5"/><path class="arc" d="M50 16.5 a11.5 11.5 0 0 1 11 8"/>
<circle class="kb" cx="50" cy="28" r="8"/><line class="kn" x1="50" y1="28" x2="50" y2="22"/>`,
    cav: `<rect class="cav" x="23" y="49" width="54" height="40" rx="17"/>`,
    drw: `<rect class="gap" x="22" y="48" width="56" height="42" rx="18"/>
<rect class="fr" x="23.5" y="49" width="53" height="39" rx="16.5"/><path class="hl" d="M34 50.5 h32"/>
<rect class="hs" x="35" y="70" width="30" height="8" rx="4"/><rect class="hd" x="35" y="66" width="30" height="9" rx="4.5"/>`},
  B: {t: 'B · Rundes Display + Fenster', d: 'Rundes Display mit Temperatur und Ring, Schublade mit ovalem Sichtfenster und 3 schrägen Pommes.',
    body: `<ellipse class="sh" cx="50" cy="96" rx="32" ry="3"/>
<rect class="bd" x="17" y="7" width="66" height="88" rx="26"/>
<circle class="ring" cx="50" cy="27" r="12"/><path class="arc" d="M50 15 a12 12 0 0 1 11.4 15.7"/>
<circle class="disp" cx="50" cy="27" r="9"/><text class="dt" x="50" y="29.5">180°</text>`,
    cav: `<rect class="cav" x="23" y="47" width="54" height="42" rx="17"/>`,
    drw: `<rect class="gap" x="22" y="46" width="56" height="44" rx="18"/>
<rect class="fr" x="23.5" y="47" width="53" height="41" rx="16.5"/><path class="hl" d="M34 48.5 h32"/>
<rect class="win" x="32" y="52" width="36" height="15" rx="7.5"/><rect class="glo" x="32" y="52" width="36" height="15" rx="7.5"/>
<line class="fry" x1="37" y1="63" x2="44" y2="58"/><line class="fry" x1="48.5" y1="63.5" x2="58" y2="60"/><line class="fry" x1="61.5" y1="63" x2="64" y2="58.5"/>
<rect class="hs" x="37" y="76" width="26" height="7" rx="3.5"/><rect class="hd" x="37" y="72" width="26" height="8" rx="4"/>`},
  C: {t: 'C · Bauchig, Griff steht vor', d: 'Unten breiter, oben Knopf mit zwei Tasten. Kräftiger Griff, der deutlich vor der Schublade steht.',
    body: `<ellipse class="sh" cx="50" cy="96" rx="36" ry="3.2"/>
<path class="bd" d="M34 7 h32 a18 18 0 0 1 17.6 14.3 l4 50 a20 20 0 0 1 -20 23.7 h-35.2 a20 20 0 0 1 -20 -23.7 l4 -50 A18 18 0 0 1 34 7 Z"/>
<circle class="btn" cx="35" cy="26" r="3"/><circle class="btn" cx="65" cy="26" r="3"/>
<circle class="ring" cx="50" cy="26" r="10.5"/><path class="arc" d="M50 15.5 a10.5 10.5 0 0 1 10 7.4"/>
<circle class="kb" cx="50" cy="26" r="7.5"/><line class="kn" x1="50" y1="26" x2="50" y2="20.5"/>`,
    cav: `<rect class="cav" x="20" y="47" width="60" height="42" rx="18"/>`,
    drw: `<rect class="gap" x="19" y="46" width="62" height="44" rx="19"/>
<rect class="fr" x="20.5" y="47" width="59" height="41" rx="17.5"/><path class="hl" d="M32 48.5 h36"/>
<ellipse class="hs" cx="50" cy="77" rx="19" ry="4.5"/><rect class="hd" x="31" y="62" width="38" height="13" rx="6.5"/><path class="hl" d="M36 64.5 h28"/>`},
  D: {t: 'D · Display-Ring + Fenster oben', d: 'Rundes Display mit zwei kleinen Tasten, Fenster im oberen Teil der Schublade, darunter ein runder Bügelgriff.',
    body: `<ellipse class="sh" cx="50" cy="96" rx="32" ry="3"/>
<rect class="bd" x="17" y="7" width="66" height="88" rx="24"/>
<rect class="pn" x="25" y="14" width="50" height="26" rx="13"/>
<circle class="btn" cx="33" cy="27" r="2.6"/><circle class="btn" cx="67" cy="27" r="2.6"/>
<circle class="ring" cx="50" cy="27" r="10"/><path class="arc" d="M50 17 a10 10 0 0 1 9.5 6.9"/>
<circle class="disp" cx="50" cy="27" r="7.5"/><text class="dt" x="50" y="29.3" style="font-size:6px">12'</text>`,
    cav: `<rect class="cav" x="23" y="47" width="54" height="42" rx="17"/>`,
    drw: `<rect class="gap" x="22" y="46" width="56" height="44" rx="18"/>
<rect class="fr" x="23.5" y="47" width="53" height="41" rx="16.5"/><path class="hl" d="M34 48.5 h32"/>
<path class="win" d="M31 52 h38 a6 6 0 0 1 6 6 v1 a8 8 0 0 1 -8 8 h-34 a8 8 0 0 1 -8 -8 v-1 a6 6 0 0 1 6 -6 Z"/>
<line class="fry" x1="38" y1="63" x2="47" y2="58.5"/><line class="fry" x1="52" y1="63.5" x2="61" y2="60.5"/>
<path class="hs" d="M36 82 q14 6 28 0 v-2 h-28 Z"/><path class="hd" d="M36 72 h28 a4 4 0 0 1 4 4 v0 a5 5 0 0 1 -5 5 h-26 a5 5 0 0 1 -5 -5 v0 a4 4 0 0 1 4 -4 Z"/>`},
};
// zu = Gehäuse + Schublade an Ort; raus = Gehäuse mit leerer Öffnung, Schublade daneben (mit eigenem Schatten)
const svg = (k, open) => { const x = D[k];
  return `<svg viewBox="0 0 100 100"><g ${open ? 'transform="translate(-5 8) scale(.82)"' : ''}>${x.body}${open ? x.cav : ''}</g><g ${open ? `transform="${OPEN}"` : ''}>${open ? '<ellipse class="sh" cx="50" cy="92" rx="30" ry="3.5"/>' : ''}${x.drw}</g></svg>`; };
document.getElementById('g').innerHTML = Object.keys(D).map(k => `<div class="col"><h2>${D[k].t}</h2><p>${D[k].d}</p>
<div class="big"><div>${svg(k, false)}<div class="lbl">zu</div></div><div>${svg(k, true)}<div class="lbl">Schublade raus</div></div></div>
<div class="card">${svg(k, false)}<div><b>Gart</b><small>noch 12 min</small></div></div>
<div class="card">${svg(k, true)}<div><b>Schublade offen</b><small>Kartengröße</small></div></div></div>`).join('');
</script></body></html>
